<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- セキュリティ：読み込めるスクリプトを自サイトと SheetJS 公式 CDN に限定し、外部への送信を禁止 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self' blob:">
  <meta name="referrer" content="no-referrer">
  <title>評価仕様書兼報告書</title>
  <meta name="description" content="評価仕様書とエビデンス付き報告書をブラウザだけで作成・管理するアプリ">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231e3a8a'/%3E%3Cpath d='M18 34l9 9 19-21' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/report.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" title="評価仕様書兼報告書">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="currentColor"/><path d="M18 34l9 9 19-21" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-text">評価仕様書兼報告書</span>
      </div>
      <label class="project-select">
        <span class="sr-only">プロジェクト</span>
        <select id="projectSelect" aria-label="プロジェクト"></select>
      </label>
      <div class="menu-wrap">
        <button id="menuBtn" class="btn" aria-haspopup="true" aria-expanded="false">☰ <span class="hide-sm">メニュー</span></button>
        <div id="menu" class="menu" role="menu" hidden>
          <div class="menu-group">プロジェクト</div>
          <button data-action="project-new" role="menuitem">新規プロジェクト</button>
          <button data-action="project-edit" role="menuitem">プロジェクト情報の編集（表紙）</button>
          <button data-action="snippets" role="menuitem">📋 共通手順の管理</button>
          <button data-action="renumber" role="menuitem">ID を並び順で振り直し</button>
          <button data-action="project-sample" role="menuitem">サンプルプロジェクトを作成</button>
          <button data-action="project-delete" role="menuitem" class="danger">このプロジェクトを削除</button>
          <div class="menu-group">ファイル（チーム間の受け渡し）</div>
          <button data-action="file-save" role="menuitem">💾 プロジェクトを保存（.zip）</button>
          <button data-action="file-open" role="menuitem">📂 プロジェクトを読み込み（.zip）</button>
          <button data-action="import-text" role="menuitem">🤖 AI で雛形を作成・補完（テキスト取り込み）</button>
          <button data-action="import-excel" role="menuitem">📥 Excel 仕様書を取り込み</button>
          <div class="menu-group">納品物</div>
          <button data-action="out-pdf" role="menuitem">📕 製本用 PDF（印刷）</button>
          <button data-action="out-html" role="menuitem">🌐 閲覧用 HTML（動画も再生可）</button>
          <div class="menu-group">ヘルプ</div>
          <button data-action="shortcuts" role="menuitem">⌨ キーボード操作</button>
        </div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="dashboard">ダッシュボード</button>
      <button class="tab" role="tab" data-view="list">一覧</button>
    </nav>

    <main>
      <section id="view-dashboard" class="view" hidden></section>

      <section id="view-list" class="view" hidden>
        <div class="toolbar">
          <div class="filters">
            <select id="fMajor" aria-label="大項目で絞り込み"></select>
            <select id="fResult" aria-label="判定で絞り込み"></select>
            <select id="fAssignee" aria-label="担当で絞り込み"></select>
            <input id="fQuery" type="search" placeholder="キーワード検索" aria-label="キーワード検索">
            <label class="chk"><input id="fWarn" type="checkbox"> ⚠ 要確認のみ</label>
            <button id="fClear" class="btn btn-ghost btn-sm" type="button">クリア</button>
          </div>
          <div class="toolbar-right">
            <span id="listCount" class="muted"></span>
            <button id="addItemBtn" class="btn btn-primary only-mobile" type="button">＋ 追加</button>
          </div>
        </div>

        <div id="gridTools" class="grid-tools">
          <div class="seg" role="group" aria-label="表示する列">
            <span class="seg-label">列：</span>
            <button data-preset="create" title="仕様書づくり：手順・期待結果を中心に表示">作成</button>
            <button data-preset="run" title="試験実施：判定・実績・エビデンスを中心に表示">実施</button>
            <button data-preset="all">すべて</button>
          </div>
          <div class="tool-group">
            <button class="btn btn-sm btn-ai" data-tool="ai" title="AI 用の指示文を作り、結果を貼り付けて取り込み">🤖 AI で雛形・補完</button>
            <button class="btn btn-sm" data-tool="reviewed" title="選択行の「要確認」の印を外す">✓ 確認済み</button>
          </div>
          <div class="tool-group">
            <button class="btn btn-sm btn-primary" data-tool="add" title="選択行の下に追加">＋ 行を追加</button>
            <button class="btn btn-sm" data-tool="dup" title="選択行を複製">複製</button>
            <button class="btn btn-sm" data-tool="bulk" title="選択行に同じ値を入力">一括入力</button>
            <button class="btn btn-sm" data-tool="del" title="選択行を削除">削除</button>
          </div>
          <div class="tool-group">
            <button class="btn btn-sm" data-tool="undo" title="元に戻す (Ctrl+Z)" disabled>↶ 元に戻す</button>
            <button class="btn btn-sm" data-tool="redo" title="やり直し (Ctrl+Y)" disabled>↷</button>
          </div>
          <div class="tool-group">
            <button class="btn btn-sm" data-tool="detail" title="詳細パネル (Ctrl+Enter)">詳細・エビデンス</button>
            <button class="btn btn-sm btn-ghost" data-tool="help" title="キーボード操作">⌨</button>
          </div>
        </div>
        <div id="gridHost" class="grid-host"></div>

        <div id="cardList" class="table-wrap" hidden>
          <table class="items">
            <tbody id="itemsBody"></tbody>
          </table>
          <div id="listEmpty" class="empty" hidden></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 詳細パネル -->
  <div id="detailBackdrop" class="backdrop" hidden></div>
  <aside id="detail" class="detail" aria-label="項目の詳細" hidden></aside>

  <!-- ライトボックス -->
  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-top">
      <span id="lbCaption"></span>
      <button class="lb-close" data-lb="close" aria-label="閉じる">✕</button>
    </div>
    <button class="lb-nav lb-prev" data-lb="prev" aria-label="前の画像">‹</button>
    <div class="lb-stage">
      <img id="lbImg" alt="">
      <video id="lbVideo" controls playsinline hidden></video>
      <div id="lbLink" class="lb-link" hidden></div>
    </div>
    <button class="lb-nav lb-next" data-lb="next" aria-label="次の画像">›</button>
  </div>

  <!-- モーダル -->
  <div id="modalRoot"></div>

  <!-- 印刷（PDF報告書）プレビュー -->
  <div id="printRoot" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/textimport.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/report.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
